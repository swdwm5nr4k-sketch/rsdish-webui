[package]
name = "rsdish"
version = "0.1.0"
edition = "2024"
build = "build.rs"
repository = "https://github.com/yuc1013/rsdish-cli"

[[bin]]
name = "rsdish"
path = "src/bin/rsdish-cli/main.rs"

[[bin]]
name = "rsdish-webui"
path = "src/bin/rsdish-webui/main.rs"

[dependencies]
anyhow = "1.0.100"
axum = "0.8"
clap = { version = "4.5.49", features = ["derive"] }
confy = "1.0.0"
dotenvy = "0.15.7"
ignore = "0.4.24"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1.0"
sysinfo = { version = "0.36.1", features = ["multithread"] }
thiserror = "2.0.17"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
toml = "0.9.8"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
uuid = { version = "1.18.1", features = ["v7"] }

[dev-dependencies]
tempfile = "3.23.0"
tower = { version = "0.5", features = ["util"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
